name: Build dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'config/comuni.yml'
      - 'config/metrics.yml'
      - 'scripts/**'
      - 'data/comuni/**/manifest.yml'
      - 'data/comuni/**/*.csv'
      - 'schemas/csv/**'

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build dashboard data
        run: node scripts/build_dashboard_data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dati, skip commit."
          else
            git commit -m "data: rebuild snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
