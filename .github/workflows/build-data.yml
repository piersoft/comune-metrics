name: Build dashboard data

# Trigger:
#   - workflow_dispatch: lancio manuale dalla UI Actions (uso primario)
#   - schedule: settimanale, domeniche notte (per Comuni virtuosi che vogliono
#     un refresh automatico). Disabilitabile commentando le 2 righe schedule.
#   - push su config/comuni.yml: ricostruisce subito quando l'adottante cambia
#     la lista dataset.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # ogni domenica alle 03:00 UTC
  push:
    branches: [main]
    paths:
      - 'config/comuni.yml'
      - 'config/metrics.yml'
      - 'scripts/**'

permissions:
  contents: write  # per committare il JSON ricostruito

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dashboard data
        run: python scripts/build_dashboard_data.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nessuna modifica ai dati, skip commit."
          else
            git commit -m "data: rebuild snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
