# ComuneMetrics — Lista Comuni e dataset cablati
#
# Questo file è il punto di estensione per qualsiasi Comune voglia adottare
# ComuneMetrics. Ogni Comune ha:
#   - un blocco identificativo (key, nome, codice IPA, codice ISTAT, mandato, ...)
#   - una mappa "datasets" che lega ogni Dataset CORE del paniere allo slug
#     CKAN del dataset reale pubblicato dal Comune su dati.gov.it.
#
# Per disattivare un Dataset CORE (= il Comune NON pubblica), lascia il campo
# vuoto (`null` o stringa vuota). Lo script di build segnerà la sezione come
# "non pubblicato dal Comune" nel JSON di output.
#
# Per le verifiche dei link e degli slug:
#   curl https://www.dati.gov.it/opendata/api/3/action/package_show?id=<slug>

ckan_server: https://www.dati.gov.it/opendata

comuni:

  bologna:
    nome: Bologna
    ipa: c_a944
    istat: "037006"
    popolazione_attesa: 388367
    mandato: "2021-2026"
    sindaco: Matteo Lepore
    mappa_center: [44.4949, 11.3426]
    mappa_zoom: 13
    datasets:
      popolazione: popolazione-residente-per-eta-sesso-cittadinanza-quartiere-e-zona-popolazione-residente-a-bolog
      bilancio: bilancio-di-previsione-previsione-uscite
      opere_pubbliche: lavori-in-corso-in-citta
      pratiche_edilizie: cila-comunicazioni-inizio-lavori
      servizi_sociali: welfare-interventi
      istruzione: numero-iscritti-ai-servizi-integrativi-scolastici-della-scuola-dellinfanzia-pubblica
      incidenti_stradali: incidenti-stradali2
      rifiuti: indicatori-raccolta-differenziata
      eventi_culturali: eventi-bologna-agenda-cultura
      delibere: null
      patrimonio: null
      tributi: null  # Bologna su Opendatasoft non espone dataset tributi facilmente aggregabili

  # Milano: rimosso dai casi d'uso ComuneMetrics v0.2 perché il WAF
  # Microsoft-Azure-Application-Gateway/v2 di dati.comune.milano.it
  # blocca sistematicamente con HTTP 403 le richieste dai runner GitHub
  # Actions (anche con retry esponenziale fino a 22s di backoff). I dataset
  # restano nel paniere come "publisher virtuoso ma non aggregabile". La
  # dashboard mostrerà Milano come "non disponibile in questa istanza —
  # il Comune pubblica ma il portale blocca gli aggregatori automatici".
  # Per riabilitarlo serve un proxy con IP italiano (self-hosted runner sul
  # VPS oppure Cloudflare Worker). Vedi cronistoria PANIERE v2.11.

  lecce:
    nome: Lecce
    ipa: c_e506
    istat: "075035"
    popolazione_attesa: 94187
    mandato: "2024-2029"
    sindaco: Adriana Poli Bortone
    mappa_center: [40.3528, 18.1718]
    mappa_zoom: 13
    # MODE STATIC_SNAPSHOT: i CSV in data/fixtures/lecce/ sono stati scaricati
    # manualmente dal browser dell'utente (IP italiano) il 2026-05-04 perché
    # il server publisher dati.comune.lecce.it ha geo-fencing attivo che
    # blocca i runner GitHub Actions (cloud Azure US/EU). Il workflow non
    # rifa il fetch HTTP per Lecce; legge i fixture e li processa.
    # Per i 4 dataset Google Drive accessibili (popolazione, opere, incidenti)
    # il builder fa comunque fetch normale.
    mode: static_snapshot
    snapshot_date: "2026-05-05"
    snapshot_reason: "Pubblicava 11/11 dataset CORE come Comune virtuoso. Il server dati.comune.lecce.it ha geo-fencing che blocca i runner GitHub Actions, quindi i CSV originali sono salvati come fixture statiche scaricate manualmente. La maggior parte dei dataset si ferma al 2015-2019: il portale OpenData del Comune non è più aggiornato per quasi tutti i settori (popolazione, bilancio, opere pubbliche, servizi sociali, rifiuti, patrimonio). Fa eccezione il dataset incidenti stradali, aggiornato al 31 dicembre 2023 (7.444 sinistri, 11 anni di serie storica). L'unico dataset CORE non recuperabile per statistiche è 'delibere': l'Albo Pretorio è esposto come feed RSS live ma senza storico."
    datasets:
      popolazione: popolazione-residente-e-bilancio-demografico-mensile-anno-2019  # Google Sheets, fetch live
      bilancio: __fixture__:bilancio                                                # consuntivo 2019
      opere_pubbliche: programma-triennale-oo-pp-2020-2022                          # Google Sheets CSV LIVE, 168 opere
      pratiche_edilizie: __fixture__:pratiche_edilizie                              # SUE 8.673 pratiche
      servizi_sociali: __fixture__:servizi_sociali                                   # 2016: 6.102 pratiche evase, 5 uffici (recuperato via goo.gl funzionante)
      istruzione: popolazione-scolastica-a-s-2021-2022                              # Google Sheets CSV LIVE, 93 scuole geo
      incidenti_stradali: __fixture__:incidenti_stradali                            # Cumulativo 2013-2023, 7.444 incidenti, 42 morti, 6.679 feriti
      rifiuti: __fixture__:rifiuti                                                   # 2015: 56.704 t RSU, 22.27% RD (12 mesi aggregati)
      eventi_culturali: __fixture__:eventi_culturali                                # 25 iniziative ricorrenti
      delibere: null  # Solo feed RSS in tempo reale, senza storico per statistiche
      patrimonio: __fixture__:patrimonio                                            # 170 fabbricati NAC 2023
      tributi: __fixture__:tributi                                                   # IMU riscosso 2015-2017 (€ 34M-37M annui), 6 righe
