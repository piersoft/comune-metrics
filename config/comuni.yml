      bilancio: dentro-il-bilancio-2024
      opere_pubbliche: null
      pratiche_edilizie: null
      servizi_sociali: siast-servizi-integrati-assistenza-sociale-territoriale
      istruzione: servizio-iscrizione-asili-nido-spazi-gioco-efficienza
      incidenti_stradali: numero-incidenti-stradali-per-quartiere-anno-2014
      rifiuti: quantita-di-rifiuti-urbani-anni-2000-2014
      eventi_culturali: teatri-e-luoghi-per-eventi
