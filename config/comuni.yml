# ComuneMetrics — Lista Comuni e dataset cablati
#
# Questo file è il punto di estensione per qualsiasi Comune voglia adottare
# ComuneMetrics. Ogni Comune ha:
#   - un blocco identificativo (key, nome, codice IPA, codice ISTAT, mandato, ...)
#   - una mappa "datasets" che lega ogni Dataset CORE del paniere allo slug
#     CKAN del dataset reale pubblicato dal Comune su dati.gov.it.
#
# Per disattivare un Dataset CORE (= il Comune NON pubblica), lascia il campo
# vuoto (`null` o stringa vuota). Lo script di build segnerà la sezione come
# "non pubblicato dal Comune" nel JSON di output.
#
# Per le verifiche dei link e degli slug:
#   curl https://www.dati.gov.it/opendata/api/3/action/package_show?id=<slug>

ckan_server: https://www.dati.gov.it/opendata

comuni:

  bologna:
    nome: Bologna
    ipa: c_a944
    istat: "037006"
    popolazione_attesa: 388367
    mandato: "2021-2026"
    sindaco: Matteo Lepore
    mappa_center: [44.4949, 11.3426]
    mappa_zoom: 13
    datasets:
      popolazione: popolazione-residente-per-eta-sesso-cittadinanza-quartiere-e-zona-popolazione-residente-a-bolog
      bilancio: bilancio-di-previsione-previsione-uscite
      opere_pubbliche: lavori-in-corso-in-citta
      pratiche_edilizie: cila-comunicazioni-inizio-lavori
      servizi_sociali: welfare-interventi
      istruzione: numero-iscritti-ai-servizi-integrativi-scolastici-della-scuola-dellinfanzia-pubblica
      incidenti_stradali: incidenti-stradali2
      rifiuti: indicatori-raccolta-differenziata
      eventi_culturali: eventi-bologna-agenda-cultura
      delibere: null
      patrimonio: null

  # Milano: rimosso dai casi d'uso ComuneMetrics v0.2 perché il WAF
  # Microsoft-Azure-Application-Gateway/v2 di dati.comune.milano.it
  # blocca sistematicamente con HTTP 403 le richieste dai runner GitHub
  # Actions (anche con retry esponenziale fino a 22s di backoff). I dataset
  # restano nel paniere come "publisher virtuoso ma non aggregabile". La
  # dashboard mostrerà Milano come "non disponibile in questa istanza —
  # il Comune pubblica ma il portale blocca gli aggregatori automatici".
  # Per riabilitarlo serve un proxy con IP italiano (self-hosted runner sul
  # VPS oppure Cloudflare Worker). Vedi cronistoria PANIERE v2.11.

  firenze:
    nome: Firenze
    ipa: c_d612
    istat: "048017"
    popolazione_attesa: 360930
    mandato: "2024-2029"
    sindaco: Sara Funaro
    mappa_center: [43.7711, 11.2552]
    mappa_zoom: 13
    datasets:
