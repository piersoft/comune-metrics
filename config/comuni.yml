# ComuneMetrics — Lista Comuni e dataset cablati
#
# Questo file è il punto di estensione per qualsiasi Comune voglia adottare
# ComuneMetrics. Ogni Comune ha:
#   - un blocco identificativo (key, nome, codice IPA, codice ISTAT, mandato, ...)
#   - una mappa "datasets" che lega ogni Dataset CORE del paniere allo slug
#     CKAN del dataset reale pubblicato dal Comune su dati.gov.it.
#
# Per disattivare un Dataset CORE (= il Comune NON pubblica), lascia il campo
# vuoto (`null` o stringa vuota). Lo script di build segnerà la sezione come
# "non pubblicato dal Comune" nel JSON di output.
#
# Per le verifiche dei link e degli slug:
#   curl https://www.dati.gov.it/opendata/api/3/action/package_show?id=<slug>

