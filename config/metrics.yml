# ComuneMetrics — Schema metriche per Dataset CORE (v2 con sinonimi reali)
#
# Sinonimi estratti dai JSON/CSV REALI dei portali comunali.
# Ogni canonical name elenca tutte le varianti viste:
# snake_case (JSON Opendatasoft), UPPERCASE (CSV labelled), Label-Case, ecc.

datasets:

  popolazione:
    titolo_paniere: "Popolazione residente"
    calculator: calc_popolazione
    expected_fields:
      anno: ["anno", "Anno", "ANNO", "year", "anno_di_riferimento"]
      eta: ["eta", "Età", "ETA", "Classe Età", "Classe di Età", "classe_eta", "fascia_eta"]
      sesso: ["sesso", "Sesso", "SESSO", "Genere", "genere"]
      cittadinanza: ["cittadinanza", "Cittadinanza", "CITTADINANZA"]
      quartiere: ["quartiere", "Quartiere", "QUARTIERE", "Zona", "Municipio", "quartiere_struttura"]
      residenti: ["residenti", "Residenti", "Numero residenti", "POP", "Totale", "n_residenti", "popolazione"]
    kpi:
      - totale_residenti
      - serie_anni
      - serie_residenti
      - per_quartiere

  bilancio:
    titolo_paniere: "Bilancio per missione e programma"
    calculator: calc_bilancio
    expected_fields:
      missione: ["missione0", "missione", "Missione", "MISSIONE", "Cod_Missione", "missione_descr"]
      programma: ["programma0", "programma", "Programma", "PROGRAMMA"]
      titolo: ["titolo0", "titolo", "Titolo"]
      macroaggregato: ["macroaggregato0", "macroaggregato"]
      importo: ["previsioni_di_competenza_primo_anno", "importo", "Importo", "IMPORTO", "Stanziato", "Spesa", "Importo finale", "valore"]
      anno: ["anno_di_riferimento", "anno", "Anno", "ANNO", "Esercizio"]
    kpi:
      - totale_uscite
      - per_missione
      - top10_programmi

  opere_pubbliche:
    titolo_paniere: "Opere pubbliche e cantieri"
    calculator: calc_opere
    expected_fields:
      nome: ["description", "Description", "DESCRIZIONE", "Descrizione", "Nome", "Titolo", "Oggetto", "denominazione_lavori"]
      stato: ["status", "Status", "Stato", "stato", "STATO", "Stato lavori"]
      lat: ["lat", "Lat", "Latitudine", "y_coord"]
      lon: ["lon", "Lon", "Longitudine", "lng", "x_coord"]
      pin_point: ["pinpoint", "pinPoint", "Coordinate geografiche", "geo_point", "geo_point_2d"]
      indirizzo: ["address", "Address", "Indirizzo", "indirizzo", "INDIRIZZO", "Via"]
      data_inizio: ["effectivestartdate", "Data di inizio lavori", "Data Inizio", "data_inizio", "DATA INIZIO"]
      data_fine: ["effectiveenddate", "Data di fine lavori", "Data Fine", "data_fine", "DATA FINE"]
      tipo_lavoro: ["roadway1", "Tipo di lavoro - 1", "tipo_lavoro", "Categoria"]
      quartiere: ["neighborhood1", "Quartiere - 1", "Quartiere", "quartiere"]
      anno: ["year", "Anno", "anno"]
      cup: ["CUP", "cup", "Cod_CUP"]
      importo: ["Importo", "importo", "Quadro economico"]
      sal: ["SAL", "sal", "Stato avanzamento", "% avanzamento"]
      fonte: ["Fonte di finanziamento", "fonte_finanziamento", "Fonte", "fonte"]
    kpi:
      - totale
      - per_stato
      - opere_geo
      - cup_count
      - importo_totale
      - per_fonte

  pratiche_edilizie:
    titolo_paniere: "Pratiche edilizie"
    calculator: calc_pratiche
    expected_fields:
      tipo: ["procedimento", "PROCEDIMENTO", "Tipo", "tipo_pratica", "TIPO PRATICA"]
      data: ["richiesta_data", "RICHIESTA DATA", "Data", "data_presentazione", "data_richiesta"]
      esito: ["esito_pratica", "ESITO PRATICA", "Esito", "esito", "DISPOSTO"]
      chiusura: ["chiusura_pratica_data", "CHIUSURA PRATICA DATA", "Data chiusura", "data_chiusura"]
      via: ["codice_via", "CODICE VIA", "Via", "via", "indirizzo"]
      civico: ["civico", "CIVICO", "Civico"]
      anno_prot: ["richiesta_anno_prot", "RICHIESTA ANNO PROT", "Anno"]
    kpi:
      - totale
      - per_tipo
      - per_esito
      - tasso_chiusura
      - serie_anni

  servizi_sociali:
    titolo_paniere: "Servizi sociali"
    calculator: calc_sociali
    expected_fields:
      target: ["target_utenza", "Target utenza", "Target", "categoria_utente"]
      categoria: ["categoria", "Categoria", "intervento_tipo"]
      intervento: ["intervento", "Intervento", "tipo_intervento", "servizio"]
      contributo: ["contributo_erogato", "Contributo erogato", "Contributo", "Importo erogato"]
