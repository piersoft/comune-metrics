      - spesa_media

  istruzione:
    titolo_paniere: "Istruzione e asili nido"
    calculator: calc_istruzione
    expected_fields:
      anno: ["anno", "anno_scolastico", "Anno", "Anno scolastico"]
      tipo_struttura: ["tipo_struttura", "Tipo struttura", "Tipologia", "tipologia_servizio", "servizio"]
      struttura: ["struttura", "Struttura", "Denominazione", "nome_struttura"]
      quartiere: ["quartiere_struttura", "Quartiere struttura", "Quartiere", "quartiere", "Zona"]
      iscritti: ["numero_iscritti", "Numero iscritti", "Iscritti", "n_iscritti"]
      lat: ["lat", "Lat", "Latitudine"]
      lon: ["lon", "Lon", "Longitudine"]
    kpi:
      - totale_iscritti
      - per_struttura
      - per_quartiere
      - serie_anni

  incidenti_stradali:
    titolo_paniere: "Incidenti stradali"
    calculator: calc_incidenti
    expected_fields:
      anno: ["anno", "Anno", "ANNO"]
      mese: ["mese", "Mese", "MESE"]
      n_incidenti: ["n_incident", "Incidenti", "Numero incidenti", "n_incidenti", "totale_incidenti"]
      n_feriti: ["totale_fer", "Feriti", "Numero feriti", "n_feriti"]
      n_morti: ["totale_mor", "Morti", "Decessi", "Numero morti", "n_morti", "n_decessi"]
      lat: ["lat", "Lat", "Latitudine", "y"]
      lon: ["lon", "Lon", "Longitudine", "x"]
      pin_point: ["geo_point_2d", "geo_point"]
      via: ["Via", "indirizzo", "tipo_strada"]
      gravita: ["Gravità", "DISPOSTO", "Tipo sinistro", "tipo_incidente"]
      zona: ["nomezona", "nomequart", "Zona di decentramento", "Quartiere", "Municipio"]
      n_pedoni_m: ["n_pedoni_m"]
      n_pedoni_f: ["n_pedoni_f"]
      n_cicl_m: ["n_cicl_m"]
      n_cicl_f: ["n_cicl_f"]
    kpi:
