      - totale_feriti
      - per_zona
      - hot_spots
      - vittime_vulnerabili

  rifiuti:
    titolo_paniere: "Raccolta rifiuti urbani"
    calculator: calc_rifiuti
    expected_fields:
      anno: ["anno", "Anno", "ANNO"]
      mese: ["mese", "Mese", "MESE"]
      rd_pct: ["raccolta_differenziata_incidenza_sulla_produzione_totale_rsu", "Raccolta differenziata: incidenza sulla produzione totale RSU", "RD %", "raccolta_differenziata_pct", "% RD"]
