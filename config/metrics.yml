      rd_santo: ["raccolta_differenziata_santo_stefano"]
      rd_sandonato: ["raccolta_differenziata_san_donato_san_vitale"]
      frazione: ["Frazione", "tipo_rifiuto", "Tipo rifiuto", "CER"]
      kg: ["Kg", "kg", "Tonnellate", "Quantità"]
      zona: ["Zona", "Quartiere", "quartiere"]
    kpi:
