      - per_quartiere
      - trend_pct

  eventi_culturali:
    titolo_paniere: "Eventi culturali e sportivi"
    calculator: calc_eventi
    expected_fields:
      titolo: ["title", "Titolo", "titolo", "Nome evento", "denominazione"]
      categoria: ["categories_1", "Categoria 1", "Categoria", "Tipo manifestazione", "tipo_evento"]
      categoria2: ["categories_2", "Categoria 2"]
      categoria3: ["categories_3", "Categoria 3"]
      data_inizio: ["start", "Data Inizio", "data_inizio", "Data", "DATA INIZIO"]
      data_fine: ["end", "Data Fine", "data_fine", "DATA FINE"]
      coordinate: ["coordinate", "Coordinate geografiche", "geo_point", "lat_lon"]
      lat: ["lat", "Lat", "Latitudine"]
      lon: ["lon", "Lon", "Longitudine"]
      indirizzo: ["address", "Indirizzo", "indirizzo", "luogo"]
