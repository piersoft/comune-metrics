# =============================================================================
# Comune DEMO — esempio di adozione del Paniere CSV federato v0.2
# =============================================================================
# Questo NON è un Comune reale. È un esempio sintetico per dimostrare il flusso
# end-to-end di adozione del paniere ComuneMetrics da parte di un Comune nuovo:
#   1. Crea data/comuni/<key>/manifest.yml
#   2. Per ogni dataset CORE che pubblichi, scegli source_type
#   3. Se source_type=fixture, metti il CSV nella stessa cartella
#   4. Apri PR — la GitHub Action validate-paniere.yml verifica gli schemi
#
# I CSV qui presenti sono dati sintetici plausibili di un Comune medio italiano
# (~36.000 abitanti, capoluogo di provincia). Servono solo come test del tool.
# =============================================================================

nome: "Comune DEMO"
ipa: "c_demo01"
istat: "999001"
popolazione_attesa: 36620
mandato: "2024-2029"
sindaco: "Mario Rossi"

mappa_center: [45.4642, 9.1900]
mappa_zoom: 14

paniere_version: "csv-v1"

datasets:

  # Dataset attivi (source_type=fixture: CSV nella stessa cartella)
  popolazione:
    source_type: fixture
    aggiornato: "2024-12-31"
    fonte: "Anagrafe comunale (dati sintetici di esempio)"

  bilancio:
    source_type: fixture
    aggiornato: "2024-12-31"
    fonte: "Bilancio di previsione 2024 (dati sintetici)"

  opere_pubbliche:
