    aggiornato: "2025-04-15"
    fonte: "Programma Triennale OO.PP. 2024-2026 (sintetico)"

  rifiuti:
    source_type: fixture
    aggiornato: "2024-12-31"
    fonte: "Servizio Igiene Urbana (dati sintetici)"

  # Dataset non pubblicati: dichiarati esplicitamente per onestà
  pratiche_edilizie:
